<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>2026 프로젝트 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F5F7;--surface:#fff;--s2:#F9FAFB;
  --b1:#E5E7EB;--b2:#D1D5DB;
  --t1:#111827;--t2:#4B5563;--t3:#9CA3AF;
  --green:#2FB344;--gbg:#EEFAF2;--gbd:#9ADCB5;
  --red:#D63939;--rbg:#FDF3F3;--rbd:#F0AEAE;
  --amber:#F76707;--abg:#FEF4EC;
  --blue:#206BC4;--bbg:#EEF3FB;--bbd:#B5CEF0;
  --para:#4E79A7;--para-bg:#EDF2F8;--para-bd:#B0C8E4;
  --acer:#59A14F;--acer-bg:#EEF7ED;--acer-bd:#AADBA5;
  --sidebar:218px;
}
html,body{height:100%;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh;overflow:hidden}

/* ── 사이드바 ── */
.sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--b1);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-head{padding:20px 16px 14px}
.sb-eye{font-size:10px;color:var(--t3);font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.sb-title{font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.4;margin-bottom:18px}
.sb-sec{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;padding:0 12px;margin-bottom:5px;margin-top:12px}
.sb-grp{margin:0 8px 2px}
.sb-ghd{display:flex;align-items:center;gap:5px;padding:8px 8px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;color:var(--t2);user-select:none;transition:background .1s}
.sb-ghd:hover{background:var(--s2)}
.sb-ghd .arr{margin-left:auto;font-size:9px;color:var(--t3);transition:transform .2s;flex-shrink:0}
.sb-ghd.open .arr{transform:rotate(90deg)}
.sb-ghd-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-yr{font-size:9px;font-weight:700;padding:1px 4px;border-radius:4px;background:#F3F4F6;color:var(--t3);flex-shrink:0}

/* ── 제품 분석 탭 + 카테고리 드롭다운 ── */
.sb-tabgroup{margin:0 2px 14px}
.sb-tabs{display:flex;gap:3px;background:var(--s2);border-radius:9px;padding:3px;margin-bottom:8px}
.sb-tab{flex:1;border:none;background:transparent;padding:6px 4px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .12s}
.sb-tab:hover{color:var(--t1)}
.sb-tab.on{background:#fff;color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sb-catselect{width:100%;font-size:12px;font-weight:500;color:var(--t2);padding:7px 10px;border:1px solid var(--b1);border-radius:8px;background:#fff;font-family:inherit;cursor:pointer}
.sb-items{padding:0 0 2px 6px}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;color:var(--t2);transition:background .1s;margin:1px 0}
.sb-item:hover{background:var(--s2)}
.sb-item.ap{background:var(--para-bg);color:var(--para);font-weight:600}
.sb-item.aa{background:var(--acer-bg);color:var(--acer);font-weight:600}
.sb-item.active-cat{font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;flex-shrink:0}
.dp{background:var(--para)}.da{background:var(--acer)}
.sb-foot{margin-top:auto;padding:10px 12px 16px;border-top:1px solid var(--b1)}

/* ── 메인 ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--b1);padding:0 22px;height:52px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.tb-bc{font-size:11px;color:var(--t3);white-space:nowrap}
.tb-bc b{color:var(--t2);font-weight:600}
.filter-wrap{display:flex;align-items:center;gap:5px;margin-left:auto;flex-wrap:wrap}
.filter-label{font-size:10px;color:var(--t3);white-space:nowrap;margin-right:2px}
.mchip{font-size:11px;font-weight:500;padding:4px 11px;border-radius:20px;border:1px solid var(--b2);background:transparent;cursor:pointer;color:var(--t2);transition:all .12s;font-family:inherit}
.mchip:hover{background:var(--s2)}
.mchip.on{background:var(--t1);color:#fff;border-color:var(--t1)}
.scroll{flex:1;overflow-y:auto;padding:22px 24px 64px}

/* ── 섹션 구분 ── */
.sec-title{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;margin:24px 0 14px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--b1)}
.sec-title:first-child{margin-top:0}

/* ── 카드 ── */
.card{background:var(--surface);border:1px solid var(--b1);border-radius:12px;padding:20px 22px}
.ct{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px}
.ct-note{font-size:10px;font-weight:400;color:var(--t3);text-transform:none;letter-spacing:0;margin-left:5px}

/* ── KPI ── */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.kc{background:var(--surface);border:1px solid var(--b1);border-radius:12px;padding:16px 18px;height:88px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.kl{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.03em;text-transform:uppercase}
.kv{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1}
.ks{font-size:10px;color:var(--t3)}

/* ── 손익 배너 ── */
.pl-banner{border-radius:12px;padding:18px 26px;margin:12px 0;border:1.5px solid;display:flex;align-items:center;justify-content:space-between}
.pl-banner.pos{background:linear-gradient(135deg,#EEFAF2 0%,#D8F3E3 100%);border-color:#7DD3A8;box-shadow:0 2px 10px rgba(47,179,68,.09)}
.pl-banner.neg{background:linear-gradient(135deg,#FDF3F3 0%,#F8D9D9 100%);border-color:#E89898;box-shadow:0 2px 10px rgba(214,57,57,.09)}
.pl-banner-left{display:flex;align-items:center;gap:12px}
.pl-banner-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.pl-banner.pos .pl-banner-icon{background:#C4EED6}
.pl-banner.neg .pl-banner-icon{background:#F6CCCC}
.pl-lbl{font-size:13px;font-weight:700;color:var(--t1)}
.pl-sub{font-size:11px;color:var(--t3);margin-top:2px}
.pl-val{font-size:32px;font-weight:700;letter-spacing:-.8px}

/* ── 인사이트 ── */
.insight{background:#EEF3FB;border:1px solid #B5CEF0;border-radius:10px;padding:13px 16px;margin:12px 0}
.ins-t{font-size:11px;font-weight:700;color:#1A5EA8;margin-bottom:6px}
.ins-ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.ins-ul li{font-size:12px;color:#1E3A5C;line-height:1.65;padding-left:12px;position:relative}
.ins-ul li::before{content:"›";position:absolute;left:0;color:#206BC4;font-weight:700}
.ins-ul b{color:#206BC4}

/* ── 그리드 ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}

/* ── P&L 행 ── */
.pr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #F3F4F6;font-size:13px}
.pr:last-child{border:none}
.pr.hd{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);padding:11px 0 3px;border:none}
.pr.ind{padding-left:14px;color:var(--t2)}
.pr.sub{font-weight:700;border-top:1px solid var(--b2);padding-top:8px;margin-top:3px}
.pr.total{font-size:15px;font-weight:700;border-top:2px solid var(--b2);padding-top:10px;margin-top:4px;border-bottom:none}

/* ── 가로바 ── */
.hb{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.hbl{width:62px;font-size:11px;color:var(--t2);text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{flex:1;background:#F3F4F6;border-radius:4px;height:20px;overflow:hidden}
.hbf{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:10px;font-weight:700;color:#fff;min-width:28px}
.hba{width:68px;font-size:11px;color:var(--t2);text-align:right;flex-shrink:0}

/* ── 테이블 공통 ── */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:10px;font-weight:600;color:var(--t3);padding:7px 10px;border-bottom:2px solid var(--b1);text-align:left;white-space:nowrap;background:var(--s2);letter-spacing:.02em;text-transform:uppercase}
.tbl th.r{text-align:right}
.tbl td{padding:9px 10px;border-bottom:1px solid #F3F4F6;font-size:12px}
.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.m{color:var(--t3);font-size:11px}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--b2);padding-top:9px;background:var(--s2)}
.tbl tfoot td.r{text-align:right}
.tbl tbody tr:hover td{background:#FAFAFA}
.sel-row td{background:#EFF6FF !important}

/* ── 현황 카드 (제품별) ── */
.prod-overview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.prod-ov-card{background:var(--surface);border:1px solid var(--b1);border-radius:12px;padding:16px 18px;border-top:3px solid}
.prod-ov-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.prod-ov-name{font-size:13px;font-weight:700}
.prod-ov-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:12px}
.prod-ov-sales{font-size:20px;font-weight:700;letter-spacing:-.4px;margin-bottom:2px}
.prod-ov-sub{font-size:10px;color:var(--t3)}
.prod-ov-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.prod-ov-stat{background:var(--s2);border-radius:7px;padding:7px 9px}
.prod-ov-stat-lbl{font-size:9px;color:var(--t3);font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin-bottom:2px}
.prod-ov-stat-val{font-size:13px;font-weight:700;letter-spacing:-.3px}

/* ── 성장률 표시 ── */
.growth{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;margin-left:4px}
.growth.up{background:#DFFAEB;color:#1D8A3A}
.growth.dn{background:#FDECEC;color:#B83030}
.growth.flat{background:#F3F4F6;color:var(--t3)}

/* ── 월별 테이블 ── */
.mtbl{width:100%;border-collapse:collapse;font-size:12px}
.mtbl th{font-size:10px;font-weight:600;color:var(--t3);padding:7px 10px;border-bottom:2px solid var(--b1);text-align:left;white-space:nowrap;background:var(--s2);letter-spacing:.02em;text-transform:uppercase}
.mtbl th.r{text-align:right}
.mtbl td{padding:9px 10px;border-bottom:1px solid #F3F4F6;font-size:12px}
.mtbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.mtbl tfoot td{font-weight:700;border-top:2px solid var(--b2);padding-top:9px;background:var(--s2)}
.mtbl tfoot td.r{text-align:right}
.mtbl tbody tr:hover td{background:#FAFAFA}
.sel-row td{background:#EFF6FF !important}

/* ── kc-tip ── */
.kc-tip{position:absolute;top:10px;right:10px;width:14px;height:14px;border-radius:50%;background:var(--b1);color:var(--t3);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:help}
.kc-tip:hover::after{content:attr(data-tip);position:absolute;top:18px;right:0;background:#1F2937;color:#fff;font-size:10px;padding:6px 9px;border-radius:7px;white-space:pre-line;z-index:200;width:150px;line-height:1.6;font-weight:400}

.pos{color:var(--green)}.neg{color:var(--red)}
@media(max-width:1100px){.g3,.prod-overview-grid{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.kpi-row,.g2,.g3,.g4,.prod-overview-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.kpi-row,.prod-overview-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">

<!-- ══ 사이드바 ══ -->
<aside class="sidebar">
  <div class="sb-head">
    <div class="sb-eye">매출 관리</div>
    <div class="sb-title">2026년<br>매출 대시보드</div>
  </div>

  <div style="padding:0 8px">
    <!-- 제품 분석: 현황/SKU진단/브리지 — 카테고리 선택 공유, 탭 전환 -->
    <div class="sb-sec" style="margin-top:0">제품 분석</div>
    <div class="sb-tabgroup">
      <div class="sb-tabs">
        <button class="sb-tab" id="tab_status" onclick="setAnalysisTab('status')">현황</button>
        <button class="sb-tab" id="tab_sku" onclick="setAnalysisTab('sku')">SKU진단</button>
        <button class="sb-tab" id="tab_bridge" onclick="setAnalysisTab('bridge')">브리지</button>
      </div>
      <select class="sb-catselect" id="analysisCatSelect" onchange="setAnalysisCat(this.value)">
        <option value="all">전체</option>
        <option value="알파cd">알파cd</option>
        <option value="파라다이스">파라다이스</option>
        <option value="프리">프리</option>
        <option value="비어랩">비어랩</option>
        <option value="아세로라">아세로라</option>
        <option value="베리">베리</option>
        <option value="기타">기타</option>
      </select>
    </div>

    <!-- 폴더: 제품 라인 손익 (기본 접힘) -->
    <div class="sb-sec">제품 라인 손익</div>
    <div class="sb-grp">
      <div class="sb-ghd" id="grp_pnl" onclick="toggleGrp('pnl')">
        <span>📁</span><span class="sb-ghd-label">2026년 프로젝트</span>
        <span class="sb-yr">2</span><span class="arr">▶</span>
      </div>
      <div class="sb-items" id="grpItems_pnl" style="display:none">
        <div class="sb-item ap" id="item_para" onclick="setView('pnl','para')">
          <span class="dot dp"></span>파라다이스그레인
        </div>
        <div class="sb-item" id="item_acer" onclick="setView('pnl','acer')">
          <span class="dot da"></span>그린아세로라
        </div>
      </div>
    </div>
  </div>

  <div class="sb-foot">
    <div style="font-size:10px;color:var(--t3);text-align:center;padding:6px 0;line-height:1.7">
      📎 매출대시보드_원장.xlsx<br>데이터 내장
    </div>
  </div>
</aside>

<!-- ══ 메인 ══ -->
<div class="main">
  <div class="topbar">
    <div class="tb-bc">2026년 › <b id="tbName">파라다이스그레인</b></div>
    <div class="filter-wrap" id="filterWrap"></div>
  </div>
  <div class="scroll" id="scrollArea"></div>
</div>
</div>

  if(a>=1e8) return s+'₩'+(a/1e8).toFixed(1)+'억';
  if(a>=1e4) return s+'₩'+Math.round(a/1e4).toLocaleString('ko-KR')+'만';

const WF = n=>(n<0?'-':'')+W(Math.abs(n))+'원';

function growthBadge(cur, prev){
  if(!prev) return '';
  const r=(cur-prev)/Math.abs(prev)*100;
  const cls=r>2?'up':r<-2?'dn':'flat';
  const sym=r>2?'▲':r<-2?'▼':'━';
  return `<span class="growth ${cls}">${sym} ${Math.abs(r).toFixed(0)}%</span>`;
}

function hexToRgba(hex,a){
  if(hex.startsWith('var')) return 'rgba(100,100,100,'+a+')';
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ── 월 필터 ── */
function allMonthsFor(){
  const s=new Set();
  if(curView==='pnl'){
    const cat=PNL_CATS[curProd];
    [...RAW,...ONLINE,...SAMPLE,...PURCHASE,...OTHER].forEach(r=>{if(r.cat===cat&&r.w)s.add(r.w);});
  } else {
    const src = curCat==='all' ? RAW : RAW.filter(r=>r.cat===curCat);
    src.forEach(r=>{if(r.w)s.add(r.w);});
  }
  return [...s].sort((a,b)=>MO.indexOf(a)-MO.indexOf(b));
}
function activeMonths(){ const all=allMonthsFor(); return curMonths?all.filter(m=>curMonths.includes(m)):all; }

// 생애주기·브리지·SKU진단은 항상 최근 "마감월" 기준 — 진행 중인 당월은 판정 대상에서 제외
function getBaseMonth(months){
  if(!months.length) return null;
  const now=new Date(), curLabel=(now.getMonth()+1)+'월';
  const last=months.at(-1);
  return (last===curLabel && months.length>1) ? months.at(-2) : last;
}

function buildFilter(){
  if(curView==='sku'){
    const ms=allMonthsFor();
    const trueBase=getBaseMonth(ms);
    if(!trueBase){ document.getElementById('filterWrap').innerHTML=`<span class="filter-label">데이터 없음</span>`; return; }
    const avail=ms.slice(0, ms.indexOf(trueBase)+1); // 마감된(진행중이 아닌) 달까지만 스냅샷 조회 허용
    const sel=(skuSnapMonth && avail.includes(skuSnapMonth)) ? skuSnapMonth : trueBase;
    let h=`<span class="filter-label">기준월(스냅샷)</span>`;
    h+=avail.map(m=>`<button class="mchip ${m===sel?'on':''}" onclick="setSkuSnapMonth('${m}')">${m}${m===trueBase?'(마감)':''}</button>`).join('');
    document.getElementById('filterWrap').innerHTML=h;
    return;
  }
  if(curView==='bridge'){
    const ms=allMonthsFor();
    const base=getBaseMonth(ms);
    const idx=base?ms.indexOf(base):-1;
    const prev=idx>0?ms[idx-1]:null;
    document.getElementById('filterWrap').innerHTML = (base&&prev)
      ? `<span class="filter-label">비교 구간</span><span class="mchip on" style="cursor:default">${prev} → ${base} (마감)</span>`
      : `<span class="filter-label">비교할 전월 데이터 없음</span>`;
    return;
  }
  const ms=allMonthsFor();
  let h=`<span class="filter-label">기간</span>`;
  h+=`<button class="mchip ${!curMonths?'on':''}" onclick="setMonthFilter(null)">전체</button>`;
  ms.forEach(m=>h+=`<button class="mchip ${curMonths&&curMonths.includes(m)?'on':''}" onclick="toggleMonth('${m}')">${m}</button>`);
  document.getElementById('filterWrap').innerHTML=h;
}
function setMonthFilter(m){curMonths=m;buildFilter();renderAll();}
function toggleMonth(m){
  if(!curMonths)curMonths=[m];
  else{const i=curMonths.indexOf(m);if(i>=0){curMonths=curMonths.filter(x=>x!==m);if(!curMonths.length)curMonths=null;}else curMonths=[...curMonths,m].sort((a,b)=>MO.indexOf(a)-MO.indexOf(b));}
  buildFilter(); renderAll();
}

if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.arcTo(x+w,y,x+w,y+r,r);this.lineTo(x+w,y+h-r);this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);this.arcTo(x,y+h,x,y+h-r,r);this.lineTo(x,y+r);this.arcTo(x,y,x+r,y,r);this.closePath();return this;};}

   손익 뷰 (기존)
══════════════════════════════ */
function calcPnl(months){
  const cat=PNL_CATS[curProd];
  const rf=RAW.filter(r=>r.cat===cat&&months.includes(r.w));
  const of=ONLINE.filter(r=>r.cat===cat&&months.includes(r.w));
  const sf=SAMPLE.filter(r=>r.cat===cat&&months.includes(r.w));
  const pf=PURCHASE.filter(r=>r.cat===cat&&months.includes(r.w));
  const xf=OTHER.filter(r=>r.cat===cat&&months.includes(r.w));
  const 매출=rf.reduce((a,r)=>a+r.sales,0);
  const ppl=rf.reduce((a,r)=>a+r.ppl,0);
  const 광고방송=rf.filter(r=>r.media==='방송').reduce((a,r)=>a+r.adv,0);
  const 광고온라인=of.reduce((a,r)=>a+r.amt,0);
  const 샘플=sf.reduce((a,r)=>a+r.amt,0);
  const 기타=xf.reduce((a,r)=>a+r.amt,0);
  const 매입=pf.reduce((a,r)=>a+r.amt,0);
  const 총비용=ppl+광고방송+광고온라인+샘플+기타;
  // 선택 기간의 마지막 월 재고 사용 (1월→1월31일, 전체→마지막월 기준)
  const MO_ORDER=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const lastMon=months.slice().sort((a,b)=>MO_ORDER.indexOf(a)-MO_ORDER.indexOf(b)).at(-1)||'';
  const 재고=(STOCK_MONTHLY[lastMon]||{})[cat]||0;
  const 손익=매출-매입-총비용+재고;
  return{매출,매입,ppl,광고방송,광고온라인,샘플,기타,총비용,재고,lastMon,손익,
    mer:총비용?매출/총비용:0,손익률:매출?손익/매출:0,rf,of,sf,pf,xf};
}

/* ══════════════════════════════
   현황 뷰 — 집계
══════════════════════════════ */
function calcStatus(months, cat){
  const src = cat==='all' ? RAW : RAW.filter(r=>r.cat===cat);
  const rf = src.filter(r=>months.includes(r.w));
  const sales = rf.reduce((a,r)=>a+r.sales,0);
  const ppl   = rf.reduce((a,r)=>a+r.ppl,0);
  const adv   = rf.filter(r=>r.media==='방송').reduce((a,r)=>a+r.adv,0);
  // 온라인광고비 (별도 시트)
  const of = (cat==='all' ? ONLINE : ONLINE.filter(r=>r.cat===cat))
             .filter(r=>months.includes(r.w));
  const advOnline = of.reduce((a,r)=>a+r.amt,0);
  // 광고유형별
  const advTypeMap={};
  of.forEach(r=>{const k=r.type||'그외';advTypeMap[k]=(advTypeMap[k]||0)+r.amt;});
  const totalCost = ppl+adv+advOnline;
  // 중분류별
  const subMap={};
  rf.forEach(r=>{subMap[r.sub]=(subMap[r.sub]||0)+r.sales;});
  // 채널(biz)별
  const bizMap={};
  rf.forEach(r=>{
    if(!bizMap[r.biz]) bizMap[r.biz]={sales:0,qty:0};
    bizMap[r.biz].sales+=r.sales;
    bizMap[r.biz].qty+=(r.qty||0);
  });
  // 미디어별
  const mediaMap={};
  rf.forEach(r=>{const k=r.media||'기타';mediaMap[k]=(mediaMap[k]||0)+r.sales;});
  // 상품별
  const prodMap={};
  rf.filter(r=>r.sales>0).forEach(r=>{
    if(!prodMap[r.prod]) prodMap[r.prod]={sales:0,qty:0,units:0,config:r.config||1};
    prodMap[r.prod].sales+=r.sales;
    prodMap[r.prod].qty+=(r.qty||0);
    prodMap[r.prod].units+=(r.qty||0)*(r.config||1);
  });
  return{sales,ppl,adv,advOnline,totalCost,mer:totalCost?sales/totalCost:0,
    subMap,bizMap,mediaMap,prodMap,advTypeMap,rf,of};
}

/* ══════════════════════════════
   매체×중분류×복합상품여부 진단 (v6 §1 — SKU 대신 3단 집계)
══════════════════════════════ */
// (media,sub,복합여부)별 RAW 행 그룹 (1회 계산) — media/sub는 원장에 이미 깨끗해 SKU 표준화 불필요.
// 복합상품여부는 P열(단위박스(2)) 존재로만 판정 — 중분류 라벨의 "&" 표기 불일치를 데이터로 우회(v6 §0).
const RAW_BY_MS = (()=>{
  const m={};
  RAW.forEach(r=>{
    if(!r.media||!r.sub) return;
    const combo = r.p2>0 ? '복합' : '단품';
    const k=r.media+'_'+r.sub+'_'+combo;
    (m[k]=m[k]||[]).push(r);
  });
  return m;
})();
const SKU_META = (()=>{
  const out={};
  Object.entries(RAW_BY_MS).forEach(([key,rows])=>{
    if(!rows.some(r=>r.qty>0)) return;
    const media=rows[0].media, sub=rows[0].sub, cat=rows[0].cat;
    const combo = rows.some(r=>r.p2>0) ? '복합' : '단품';
    const prods=[...new Set(rows.map(r=>r.prod).filter(Boolean))];
    const firstSaleMonth=rows.filter(r=>r.qty>0).map(r=>r.w).sort((a,b)=>MO.indexOf(a)-MO.indexOf(b))[0];
    out[key]={media, sub, cat, combo, label:`${media}-${sub}-${combo}`, prods, firstSaleMonth};
  });
  return out;
})();
const SKU_LIST = Object.keys(SKU_META);

// 상품분석_설계도_v3.md §6 표 그대로(추측치 아님) + v5 §3 판정 순서/분모0 예외
const LIFECYCLE_CFG = {
  significantSales: 1_000_000,   // 과거 유의미 매출 기준 (원)
  significantQty: 10,            // 과거 유의미 누적 판매수량 기준 (박스)
  growthPct: 0.10,                // 하락/성장 판정 임계 (G_t, G_t-1, 폴백 공통)
};
const SIGNAL_THRESHOLDS = {
  salesUpPriceDown: {salesGrowth:0.10,  priceGrowth:-0.05},   // 매출↑단가↓
  qtyDownPriceUp:   {qtyGrowth:-0.10,   priceGrowth:0.05},    // 수량↓가격↑
  advUpSalesDown:   {advGrowth:0.10,    chSalesGrowth:-0.10}, // 광고비↑매출↓ (해당 채널=온라인 매출 기준)
  largeConfigSurge: {qtyShareIncrease:0.15},                  // 대형구성비중급증 (판매수량 비중, %p)
  singleChannelDep: {top1Share:0.70},                         // 단일채널의존
};

// 원장누락 의심 — 대분류/거래처 단위로 1회만 계산 (SKU 판정 시 조회만)
// "매출은 있으나 SKU/카테고리 필드가 없음" 조건은 파이프라인 앞단(build.py 필터)에서
// 이미 걸러지므로 여기선 구현하지 않음.
const LEDGER_GAP = (()=>{
  const flagged = new Set(); // "대분류_월" 형태
  const allMonths = [...new Set(RAW.map(r=>r.w).filter(Boolean))].sort((a,b)=>MO.indexOf(a)-MO.indexOf(b));
  const catMonthTotal = {}, catBizMonthTotal = {};
  RAW.forEach(r=>{
    if(!r.cat || !r.w) return;
    catMonthTotal[r.cat]=catMonthTotal[r.cat]||{};
    catMonthTotal[r.cat][r.w]=(catMonthTotal[r.cat][r.w]||0)+r.sales;
    catBizMonthTotal[r.cat]=catBizMonthTotal[r.cat]||{};
    catBizMonthTotal[r.cat][r.biz]=catBizMonthTotal[r.cat][r.biz]||{};
    catBizMonthTotal[r.cat][r.biz][r.w]=(catBizMonthTotal[r.cat][r.biz][r.w]||0)+r.sales;
  });
  // 카테고리 전체가 특정월에 갑자기 0
  Object.entries(catMonthTotal).forEach(([cat,byMonth])=>{
    allMonths.forEach((m,i)=>{
      if(i===0) return;
      const prev=allMonths[i-1];
      if((byMonth[m]||0)<=0 && (byMonth[prev]||0)>0) flagged.add(cat+'_'+m);
    });
  });
  // 직전 3개월 꾸준했던(카테고리 매출의 10%+ 비중) 거래처가 이번 달 갑자기 0
  Object.entries(catBizMonthTotal).forEach(([cat,byBiz])=>{
    const catByMonth=catMonthTotal[cat]||{};
    Object.values(byBiz).forEach(byMonth=>{
      for(let i=3;i<allMonths.length;i++){
        const cur=allMonths[i], m1=allMonths[i-1], m2=allMonths[i-2], m3=allMonths[i-3];
        if((byMonth[m1]||0)>0 && (byMonth[m2]||0)>0 && (byMonth[m3]||0)>0 && (byMonth[cur]||0)<=0){
          const avg3=((byMonth[m1]||0)+(byMonth[m2]||0)+(byMonth[m3]||0))/3;
          const catAvg3=((catByMonth[m1]||0)+(catByMonth[m2]||0)+(catByMonth[m3]||0))/3;
          if(catAvg3>0 && avg3/catAvg3>=0.10) flagged.add(cat+'_'+cur);
        }
      }
    });
  });
  return flagged;
})();

function fallbackTrend(recent3, prior3){
  if(recent3<=prior3*(1-LIFECYCLE_CFG.growthPct)) return '하락';
  if(recent3>=prior3*(1+LIFECYCLE_CFG.growthPct)) return '성장';
  return '유지';
}

// 설계도 v5 §3 판정 순서 그대로: 원장누락의심→휴면→신규→관측기간부족→분모0예외→하락/성장/유지
// monthBox: 월별 총박스수(qty×config) 배열 — v6: qty(세트)가 아니라 실제 박스 기준으로 판정
function classifyLifecycle(meta, monthSales, monthBox, months, idx, ledgerFlagged){
  const firstSaleIdx = Math.max(0, months.indexOf(meta.firstSaleMonth));

  let cumBox=0, hasSignificant=false;
  for(let i=0;i<=idx;i++){
    cumBox+=monthBox[i];
    if(monthSales[i]>=LIFECYCLE_CFG.significantSales) hasSignificant=true;
  }
  if(cumBox>=LIFECYCLE_CFG.significantQty) hasSignificant=true;

  let noSaleStreak=0;
  for(let i=idx;i>=0;i--){ if(monthSales[i]<=0) noSaleStreak++; else break; }

  if(ledgerFlagged) return {lifecycle:'판정유보', dataState:'원장누락 의심', signals:[], hasSignificant, noSaleStreak};
  if(hasSignificant && noSaleStreak>=2) return {lifecycle:'휴면', dataState:'정상', signals:[], hasSignificant, noSaleStreak};

  // v5/v6 원안은 "신규"(최초판매 3개월 이내)와 "판정유보·관측기간부족"(6개월 미만)을
  // 분리했으나, 사용자 확인 후 예외 적용: 원장누락은 이미 위에서 먼저 걸러지므로
  // 이 시점에 관측기간이 짧은 이유는 항상 "최근 런칭"뿐 — 6개월 미만 전체를 "신규"로 통합.
  const availableSpan = idx-firstSaleIdx+1;
  if(availableSpan<6) return {lifecycle:'신규', dataState:'정상', signals:[], hasSignificant, noSaleStreak};

  const avg=(s,e)=>{ let sum=0; for(let i=s;i<=e;i++) sum+=monthSales[i]; return sum/(e-s+1); };
  const recent3=avg(idx-2,idx), prior3=avg(idx-5,idx-3);

  if(prior3<0) return {lifecycle:'판정유보', dataState:'음수매출', signals:[], hasSignificant, noSaleStreak};
  if(prior3===0 && recent3===0) return {lifecycle:'판정유보', dataState:'정상', signals:[], hasSignificant, noSaleStreak};
  if(prior3===0 && recent3>0) return {lifecycle:'판정유보', dataState:'정상', signals:['재활성'], hasSignificant, noSaleStreak};

  let lifecycle;
  if(availableSpan>=7){
    const recent3Prev=avg(idx-3,idx-1), prior3Prev=avg(idx-6,idx-4);
    if(prior3Prev>0){
      const Gt=recent3/prior3-1, Gt1=recent3Prev/prior3Prev-1;
      if(Gt<=-LIFECYCLE_CFG.growthPct && Gt1<=-LIFECYCLE_CFG.growthPct) lifecycle='하락';
      else if(Gt>=LIFECYCLE_CFG.growthPct && Gt1>=LIFECYCLE_CFG.growthPct) lifecycle='성장';
      else lifecycle='유지';
    } else {
      // G_t-1 분모가 0/음수 — 설계도에 명시 안 된 방어 코드. 이중판정 대신 단순 3개월 폴백으로 강등.
      lifecycle=fallbackTrend(recent3,prior3);
    }
  } else {
    lifecycle=fallbackTrend(recent3,prior3);
  }

  return {lifecycle, dataState:'정상', signals:[], hasSignificant, noSaleStreak};
}

function computeSignals(row, lifecycle, dataState, hasSignificant, subShareSurge){
  const signals = subShareSurge ? ['대형구성비중급증'] : [];
  if(dataState==='관측기간 부족') signals.push('판정데이터부족');
  if(hasSignificant && row.noSaleStreak>=2) signals.push('2개월무매출');

  // 박스당단가 기반 신호: 전월/당월 총박스수<=0이면 계산 제외(설계도 §6 공통 전제조건)
  if(row.box>0 && row.prevBox>0){
    const asp=row.sales/row.box, prevAsp=row.prevSales/row.prevBox;
    const priceGrowth=(asp-prevAsp)/prevAsp;
    const qtyGrowth=(row.box-row.prevBox)/row.prevBox;
    if(row.prevSales>0){
      const salesGrowth=(row.sales-row.prevSales)/row.prevSales;
      if(salesGrowth>=SIGNAL_THRESHOLDS.salesUpPriceDown.salesGrowth && priceGrowth<=SIGNAL_THRESHOLDS.salesUpPriceDown.priceGrowth) signals.push('매출↑단가↓');
    }
    if(qtyGrowth<=SIGNAL_THRESHOLDS.qtyDownPriceUp.qtyGrowth && priceGrowth>=SIGNAL_THRESHOLDS.qtyDownPriceUp.priceGrowth) signals.push('수량↓가격↑');
  }

  // 광고비↑매출↓: adCost/prevAdCost는 media 분기(온라인=ONLINE시트, 방송=광고비+개런티)로 이미 계산됨.
  // row 자체가 이미 media 단위 그룹이라 row.sales가 곧 "해당 채널 매출"(v3 원문 그대로).
  if(row.prevAdCost>0 && row.prevSales>0){
    const advGrowth=(row.adCost-row.prevAdCost)/row.prevAdCost;
    const chSalesGrowth=(row.sales-row.prevSales)/row.prevSales;
    if(advGrowth>=SIGNAL_THRESHOLDS.advUpSalesDown.advGrowth && chSalesGrowth<=SIGNAL_THRESHOLDS.advUpSalesDown.chSalesGrowth) signals.push('광고비↑매출↓');
  }

  const bizVals=Object.values(row.bizMapBase||{});
  if(bizVals.length){
    const totalBiz=bizVals.reduce((a,v)=>a+v,0);
    if(totalBiz>0 && Math.max(...bizVals)/totalBiz>=SIGNAL_THRESHOLDS.singleChannelDep.top1Share) signals.push('단일채널의존');
  }

  if(lifecycle==='신규' && row.monotonicUp) signals.push('신규성장');

  return signals;
}

let skuSort = {key:'sales', dir:'desc'};
let skuSearch = '';
let skuExpanded = new Set();
let skuSnapMonth = null; // null=실제 마감월. 값이 있으면 그 달을 임시 기준월처럼 취급해 전체 재계산(스냅샷 조회)
function setSkuSnapMonth(m){ skuSnapMonth = m; renderSkuDiag(); }

const LIFECYCLE_STYLE = {
  성장:'background:#DFFAEB;color:#1D8A3A',
  하락:'background:#FDECEC;color:#B83030',
  신규:'background:#EEF3FB;color:#206BC4',
  유지:'background:#F3F4F6;color:#6B7280',
  휴면:'background:#E5E7EB;color:#374151',
  판정유보:'background:#FEF4EC;color:#B45300;border:1px dashed #F3B17A',
};
function lifecycleBadge(lifecycle, dataState){
  const style = LIFECYCLE_STYLE[lifecycle]||LIFECYCLE_STYLE['유지'];
  let html=`<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;${style}">${lifecycle}</span>`;
  if(dataState && dataState!=='정상') html+=`<div style="font-size:9px;color:var(--t3);margin-top:2px">데이터상태: ${dataState}</div>`;
  return html;
}
function signalChips(signals){
  if(!signals||!signals.length) return '<span style="color:var(--t3)">-</span>';
  return signals.map(s=>`<span style="display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:500;background:#F3F4F6;color:var(--t2);margin:1px">${s}</span>`).join('');
}

function sparkline(vals){
  const w=54,h=20,pad=2;
  const max=Math.max(...vals,1), min=Math.min(...vals,0);
  const range=(max-min)||1;
  const step=(w-2*pad)/Math.max(vals.length-1,1);
  const pts=vals.map((v,i)=>`${(pad+i*step).toFixed(1)},${(h-pad-((v-min)/range)*(h-2*pad)).toFixed(1)}`).join(' ');
  const up = vals.length>1 && vals.at(-1)>=vals[0];
  const color = up?'#2FB344':'#D63939';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function calcSkuDiag(cat){
  const months = allMonthsFor();
  const trueBaseMonth = getBaseMonth(months);
  // 월탭 스냅샷 조회: 선택된 과거월이 있으면 그 달을 임시 기준월(마감)로 취급해 전체 재계산.
  // 진행 중인 당월보다 앞선(이미 마감된) 달만 허용 — trueBaseMonth 이후 달은 선택 불가.
  const baseMonth = (skuSnapMonth && months.includes(skuSnapMonth) && months.indexOf(skuSnapMonth)<=months.indexOf(trueBaseMonth))
    ? skuSnapMonth : trueBaseMonth;
  if(!baseMonth) return {baseMonth:null, trueBaseMonth, prevMonth:null, months, rows:[]};
  const idx = months.indexOf(baseMonth);
  const prevMonth = idx>0 ? months[idx-1] : null;
  const last3 = months.slice(Math.max(0,idx-2), idx+1);

  const msKeys = cat==='all' ? SKU_LIST : SKU_LIST.filter(k=>SKU_META[k].cat===cat);

  // 중분류별 온라인 광고비(ONLINE 시트) — 기준월/전월 둘 다 필요(광고비↑매출↓ 신호의 증감 계산용)
  const onlineSpendBySub={}, onlineSpendBySubPrev={};
  ONLINE.forEach(r=>{
    if(r.w===baseMonth && r.sub) onlineSpendBySub[r.sub]=(onlineSpendBySub[r.sub]||0)+r.amt;
    if(prevMonth && r.w===prevMonth && r.sub) onlineSpendBySubPrev[r.sub]=(onlineSpendBySubPrev[r.sub]||0)+r.amt;
  });

  // v6: 실 판매(qty)는 "세트/건수"이지 박스가 아님 — 총박스수 = qty × config(=O+P)
  const boxOf = r => r.qty*(r.config||1);

  const rows = msKeys.map(key=>{
    const meta=SKU_META[key];
    const msRows=RAW_BY_MS[key]||[];
    const baseRows=msRows.filter(r=>r.w===baseMonth);
    const prevRows=prevMonth?msRows.filter(r=>r.w===prevMonth):[];
    const sales=baseRows.reduce((a,r)=>a+r.sales,0);
    const box=baseRows.reduce((a,r)=>a+boxOf(r),0);
    const prevSales=prevRows.reduce((a,r)=>a+r.sales,0);
    const prevBox=prevRows.reduce((a,r)=>a+boxOf(r),0);
    const adv=baseRows.reduce((a,r)=>a+r.adv,0);
    const prevAdv=prevRows.reduce((a,r)=>a+r.adv,0);
    const ppl=baseRows.reduce((a,r)=>a+r.ppl,0);
    const guarantee=baseRows.reduce((a,r)=>a+r.guarantee,0);
    const prevGuarantee=prevRows.reduce((a,r)=>a+r.guarantee,0);
    const bizMapBase={};
    baseRows.forEach(r=>{ bizMapBase[r.biz]=(bizMapBase[r.biz]||0)+r.sales; });
    const trend=last3.map(m=>msRows.filter(r=>r.w===m).reduce((a,r)=>a+r.sales,0));
    const monthSales=months.map(m=>msRows.filter(r=>r.w===m).reduce((a,r)=>a+r.sales,0));
    const monthBox=months.map(m=>msRows.filter(r=>r.w===m).reduce((a,r)=>a+boxOf(r),0));
    const activeMonthsCnt=monthBox.filter(b=>b>0).length;
    let noSaleStreak=0;
    for(let i=idx;i>=0;i--){ if(monthSales[i]<=0) noSaleStreak++; else break; }

    const firstSaleIdx=Math.max(0, months.indexOf(meta.firstSaleMonth));
    let monotonicUp=false;
    if(idx>firstSaleIdx){
      monotonicUp=true;
      for(let i=firstSaleIdx+1;i<=idx;i++){ if(monthSales[i]<=monthSales[i-1]){ monotonicUp=false; break; } }
    }

    // MER — 온라인만 계산(ONLINE시트가 중분류 단위로 매핑돼 그룹별 귀속 근거가 있음).
    // 방송광고비·개런티는 회차 단위로 집행되고 원장에 단품/복합 구분 없이 기록돼 이
    // (매체×중분류×복합여부) 그룹 전용으로 귀속할 근거가 없어 MER을 표시하지 않음(사용자 확인).
    // adCost/prevAdCost는 방송도 계속 계산 — 광고비↑매출↓ 신호·드릴다운 "배분 추정" 표시에 사용.
    let mer=null, merBasis=null, adCost=0, prevAdCost=0;
    if(meta.media==='온라인'){
      adCost=onlineSpendBySub[meta.sub]||0;
      prevAdCost=onlineSpendBySubPrev[meta.sub]||0;
      if(adCost>0){ mer=sales/adCost; merBasis='online'; }
    } else if(meta.media==='방송'){
      adCost=adv+guarantee;
      prevAdCost=prevAdv+prevGuarantee;
    }

    const ledgerFlagged = LEDGER_GAP.has(meta.cat+'_'+baseMonth) || baseRows.some(r=>r.qty>0 && r.sales<=0);
    const {lifecycle, dataState, signals:baseSignals, hasSignificant} =
      classifyLifecycle(meta, monthSales, monthBox, months, idx, ledgerFlagged);

    // 대형구성비중급증 — 이 조합에 속한 상품명 중 config 최댓값 상품의 총박스수 비중 급증 여부
    const prodConfig={};
    msRows.forEach(r=>{ if(r.prod) prodConfig[r.prod]=r.config||1; });
    const prodList=Object.keys(prodConfig);
    let subShareSurge=false;
    if(prodList.length){
      const maxProd=prodList.reduce((best,p)=>prodConfig[p]>prodConfig[best]?p:best, prodList[0]);
      const boxByProd=(rowsArr)=>{ const m={}; rowsArr.forEach(r=>{ if(r.prod) m[r.prod]=(m[r.prod]||0)+boxOf(r); }); return m; };
      const baseBoxByProd=boxByProd(baseRows), prevBoxByProd=boxByProd(prevRows);
      const baseShare = box ? (baseBoxByProd[maxProd]||0)/box : 0;
      const prevShare = prevBox ? (prevBoxByProd[maxProd]||0)/prevBox : 0;
      subShareSurge = (baseShare-prevShare) >= SIGNAL_THRESHOLDS.largeConfigSurge.qtyShareIncrease;
    }

    // 드릴다운 — 상품명별 상대단가 비교(v6 §1, 구 §4 흡수): 단위박스(O)/단위박스(2)(P)/총박스수/박스당단가/상대단가지수/비중
    const configRows=(()=>{
      const byProd={};
      baseRows.forEach(r=>{
        if(!r.prod) return;
        byProd[r.prod]=byProd[r.prod]||{prod:r.prod, o:r.o||1, p2:r.p2||0, sales:0, box:0};
        byProd[r.prod].sales+=r.sales; byProd[r.prod].box+=boxOf(r);
      });
      const list=Object.values(byProd).filter(x=>x.box>0).map(x=>({...x, unitPrice: x.box?x.sales/x.box:0}));
      const maxUnitPrice=Math.max(0, ...list.map(x=>x.unitPrice));
      const totalBox=list.reduce((a,x)=>a+x.box,0);
      return list.map(x=>({...x, relIndex: maxUnitPrice? x.unitPrice/maxUnitPrice : 0, boxShare: totalBox? x.box/totalBox : 0}))
        .sort((a,b)=>b.sales-a.sales);
    })();

    const row = {key, label:meta.label, media:meta.media, cat:meta.cat, sub:meta.sub, combo:meta.combo, prods:meta.prods,
      sales, box, prevSales, prevBox, adv, prevAdv, ppl, guarantee, prevGuarantee, bizMapBase,
      trend, activeMonthsCnt, noSaleStreak, mer, merBasis, adCost, prevAdCost, monotonicUp,
      lifecycle, dataState, configRows};
    row.signals = [...baseSignals, ...computeSignals(row, lifecycle, dataState, hasSignificant, subShareSurge)];
    return row;
  });

  return {baseMonth, trueBaseMonth, prevMonth, months, rows};
}

function skuSortRows(rows){
  const {key,dir}=skuSort, mul=dir==='asc'?1:-1;
  return rows.slice().sort((a,b)=>{
    if(key==='label'||key==='sub') return a[key].localeCompare(b[key])*mul;
    if(key==='mer'){
      const av=a.mer==null?-Infinity:a.mer, bv=b.mer==null?-Infinity:b.mer;
      return (av-bv)*mul;
    }
    return ((a[key]||0)-(b[key]||0))*mul;
  });
}
function setSkuSort(key){
  if(skuSort.key===key) skuSort.dir=skuSort.dir==='desc'?'asc':'desc';
  else skuSort={key, dir:(key==='label'||key==='sub')?'asc':'desc'};
  renderSkuDiag();
}
function setSkuSearch(v){
  skuSearch=v; renderSkuDiag();
  requestAnimationFrame(()=>{
    const el=document.getElementById('skuSearchInput');
    if(el){ el.focus(); const p=el.value.length; el.setSelectionRange(p,p); }
  });
}
function toggleSkuRow(key){
  if(skuExpanded.has(key)) skuExpanded.delete(key); else skuExpanded.add(key);
  renderSkuDiag();
}

function renderSkuDiag(){
  const {baseMonth, trueBaseMonth, rows} = calcSkuDiag(curCat);
  const isSnapshot = baseMonth && trueBaseMonth && baseMonth!==trueBaseMonth;

  if(!baseMonth){
    document.getElementById('scrollArea').innerHTML=`<div class="sec-title">매체×중분류 진단</div><div class="card" style="text-align:center;padding:40px;color:var(--t3)">데이터가 없습니다</div>`;
    return;
  }

  const q=skuSearch.trim().toLowerCase();
  const filtered = q ? rows.filter(r=>r.label.toLowerCase().includes(q)) : rows;
  const sorted = skuSortRows(filtered);
  const totalSales = rows.reduce((a,r)=>a+r.sales,0);
  const noAdvCount = rows.filter(r=>r.mer==null).length;
  const lifecycleCnt={};
  rows.forEach(r=>{ lifecycleCnt[r.lifecycle]=(lifecycleCnt[r.lifecycle]||0)+1; });
  const lifecycleSummary=['성장','유지','하락','신규','휴면','판정유보'].filter(k=>lifecycleCnt[k]).map(k=>`${k} ${lifecycleCnt[k]}`).join(' · ');

  const th = (label,key,align)=>{
    if(!key) return `<th class="${align||''}">${label}</th>`;

    return `<th class="${align||''}" style="cursor:pointer;user-select:none" onclick="setSkuSort('${key}')">${label}${arrow}</th>`;
  };

  const bodyRows = sorted.map(r=>{
    const growth = growthBadge(r.sales, r.prevSales);
    const boxPrice = r.box ? r.sales/r.box : 0;
    const merStr = r.mer==null ? '<span style="color:var(--t3)">N/A</span>' : X(r.mer);
    const merNote = r.merBasis==='online' ? '온라인 집행 기준' : r.media==='방송' ? '그룹 귀속 근거 없음' : '광고비 데이터 없음';
    const expanded = skuExpanded.has(r.key);
    const catColor = CAT_C[r.cat]||'#BAB0AC';
    const safeKey = r.key.replace(/'/g,"\\'");
    const configRows = r.configRows.map(c=>`<tr>
          <td>${c.prod}</td><td class="r">${c.o}</td><td class="r">${c.p2||'-'}</td>
          <td class="r">${c.box?W(c.box)+'박스':'-'}</td><td class="r">${WM(c.sales)}</td>
          <td class="r">${c.unitPrice?WF(c.unitPrice):'-'}</td>
          <td class="r" style="font-weight:${c.relIndex>=0.99?'700':'400'};color:${c.relIndex>=0.99?'var(--t1)':'var(--t2)'}">${c.unitPrice?c.relIndex.toFixed(2):'-'}</td>
          <td class="r">${c.box?(c.boxShare*100).toFixed(1)+'%':'-'}</td>

/* ══════════════════════════════
   매출 증감 브리지 (신규) — 집계키는 SKU 대신 (media,sub) 조합 그대로 사용
══════════════════════════════ */
function calcBridge(cat){
  const months = allMonthsFor();
  const baseMonth = getBaseMonth(months);
  if(!baseMonth) return null;
  const idx = months.indexOf(baseMonth);
  const prevMonth = idx>0 ? months[idx-1] : null;
  if(!prevMonth) return null;

  const msKeys = cat==='all' ? SKU_LIST : SKU_LIST.filter(k=>SKU_META[k].cat===cat);

  const items = msKeys.map(key=>{
    const meta=SKU_META[key];
    const rows=RAW_BY_MS[key]||[];
    const baseRows=rows.filter(r=>r.w===baseMonth);
    const prevRows=rows.filter(r=>r.w===prevMonth);
    // v6: Q0/Q1은 총박스수(qty×config) 기준 — 실 판매(qty)는 세트/건수라 그대로 쓰면 안 됨
    const Q1=baseRows.reduce((a,r)=>a+r.qty*(r.config||1),0);
    const Q0=prevRows.reduce((a,r)=>a+r.qty*(r.config||1),0);
    // 순수량이 0/음수로 상쇄되는 달은 매출도 0으로 처리(반품·조정 항목이 서로 다른 상품명으로
    // 잡혀 수량은 상쇄돼도 금액이 잔여로 남는 경우가 있음 — 그 잔여 매출은 브리지 계산에서 제외).
    const sales1=Q1>0 ? baseRows.reduce((a,r)=>a+r.sales,0) : 0;
    const sales0=Q0>0 ? prevRows.reduce((a,r)=>a+r.sales,0) : 0;
    const P1=Q1>0?sales1/Q1:0, P0=Q0>0?sales0/Q0:0;
    let group=null;
    if(meta.firstSaleMonth===baseMonth) group='신규';
    else if(Q0>0 && Q1>0) group='공통';
    else if(Q0<=0 && Q1>0) group='재활성';
    else if(Q0>0 && Q1<=0) group='소멸';
    return {key, label:meta.label, cat:meta.cat, media:meta.media, sub:meta.sub, Q0,Q1,P0,P1,sales0,sales1,group};
  }).filter(x=>x.group);

  const common=items.filter(x=>x.group==='공통');
  const newG=items.filter(x=>x.group==='신규');
  const react=items.filter(x=>x.group==='재활성');
  const extinct=items.filter(x=>x.group==='소멸');

  // 설계도 v5 §2 그대로 (변수명도 동일)
  const 공통수량효과 = common.reduce((a,x)=>a+(x.Q1-x.Q0)*x.P0, 0);
  const 가격효과 = common.reduce((a,x)=>a+x.Q1*(x.P1-x.P0), 0);
  const Q0_common = common.reduce((a,x)=>a+x.Q0,0);
  const Q1_common = common.reduce((a,x)=>a+x.Q1,0);
  const sales0_common = common.reduce((a,x)=>a+x.sales0,0);
  const 전월공통평균ASP = Q0_common ? sales0_common/Q0_common : 0;
  const 시장물량효과 = (Q1_common-Q0_common)*전월공통평균ASP;
  const 상품믹스효과 = 공통수량효과 - 시장물량효과;

  const newEffect = newG.reduce((a,x)=>a+x.sales1,0);
  const reactEffect = react.reduce((a,x)=>a+x.sales1,0);
  const extinctEffect = extinct.reduce((a,x)=>a+x.sales0,0);

  const totalBase = items.reduce((a,x)=>a+x.sales1,0);
  const totalPrev = items.reduce((a,x)=>a+x.sales0,0);
  const diff = totalBase-totalPrev;

  const bridgeSum = 시장물량효과+상품믹스효과+가격효과+newEffect+reactEffect-extinctEffect;
  const residual = Math.round(diff)-Math.round(bridgeSum);
  const pass = Math.abs(residual)<=1;

  // 실패 시 원인 추적 — 수량은 0(순상쇄)인데 매출만 남아 그룹 공식에서 누락되는 항목(환불/조정 잔여분)
  let anomalies=[];
  if(!pass){
    anomalies=[
      ...newG.filter(x=>x.sales0!==0).map(x=>({...x, note:'신규인데 전월 잔여매출 존재'})),
      ...react.filter(x=>x.sales0!==0).map(x=>({...x, note:'재활성인데 전월 잔여매출(수량 0) 존재'})),
      ...extinct.filter(x=>x.sales1!==0).map(x=>({...x, note:'소멸인데 당월 잔여매출(수량 0) 존재'})),
    ];
  }

  return {baseMonth, prevMonth, totalBase, totalPrev, diff, common, newG, react, extinct,
    marketVolume:시장물량효과, mix:상품믹스효과, priceEffect:가격효과, newEffect, reactEffect, extinctEffect,
    bridgeSum, residual, pass, anomalies};
}

function renderBridge(){
  const b = calcBridge(curCat);
  if(!b){
    document.getElementById('scrollArea').innerHTML=`<div class="sec-title">매출 증감 브리지</div><div class="card" style="text-align:center;padding:40px;color:var(--t3)">비교할 전월 데이터가 없습니다</div>`;
    return;
  }
  if(!b.pass){
    const anomalyRows=b.anomalies.map(x=>`<div class="pr"><span>${x.label} <span style="color:var(--t3);font-size:10px">(${x.note})</span></span><span class="neg">${WM(x.group==='소멸'?x.sales1:x.sales0)}</span></div>`).join('');
    document.getElementById('scrollArea').innerHTML=`
    <div class="sec-title">매출 증감 브리지 · ${b.prevMonth} → ${b.baseMonth}(마감)</div>
    <div class="card">
      <div class="ct" style="color:var(--red)">검증 실패 — 허용오차(±1원) 초과로 브리지를 표시하지 않습니다</div>
      <div style="font-size:12px;color:var(--t2);margin-bottom:10px">잔차 ${WF(b.residual)} — 판매수량은 순상쇄(0)됐는데 매출만 잔여로 남은 조합이 원인으로 추정됩니다(환불·조정 데이터 확인 필요):</div>
      ${anomalyRows||'<div style="color:var(--t3);font-size:12px">구체적 원인 조합을 특정하지 못했습니다 — 원장 전반을 확인해주세요.</div>'}
    </div>`;
    return;
  }

  const pc = b.diff>=0?'pos':'neg';
  const sortedCommon = b.common.slice().sort((x,y)=>Math.abs(y.sales1-y.sales0)-Math.abs(x.sales1-x.sales0)).slice(0,8);
  const sortedNew = b.newG.slice().sort((x,y)=>y.sales1-x.sales1).slice(0,5);
  const sortedReact = b.react.slice().sort((x,y)=>y.sales1-x.sales1).slice(0,5);
  const sortedExtinct = b.extinct.slice().sort((x,y)=>y.sales0-x.sales0).slice(0,5);

  // 채널 믹스 — media별 매출·수량 비중 변화 (§2: "낮은 채널" 단정 금지, ASP 실측 후에만 완화된 표현 사용)
  const mediaSalesBase={}, mediaSalesPrev={}, mediaQtyBase={};
  [...b.common,...b.newG,...b.react].forEach(x=>{ mediaSalesBase[x.media]=(mediaSalesBase[x.media]||0)+x.sales1; mediaQtyBase[x.media]=(mediaQtyBase[x.media]||0)+x.Q1; });
  [...b.common,...b.extinct].forEach(x=>{ mediaSalesPrev[x.media]=(mediaSalesPrev[x.media]||0)+x.sales0; });
  const totalQtyBase=Object.values(mediaQtyBase).reduce((a,v)=>a+v,0);
  const overallASP=totalQtyBase?b.totalBase/totalQtyBase:0;
  const mediaKeys=[...new Set([...Object.keys(mediaSalesBase),...Object.keys(mediaSalesPrev)])];
  const mediaRows=mediaKeys.map(m=>{
    const baseShare=b.totalBase?(mediaSalesBase[m]||0)/b.totalBase:0;
    const prevShare=b.totalPrev?(mediaSalesPrev[m]||0)/b.totalPrev:0;
    const mediaASP=mediaQtyBase[m]?(mediaSalesBase[m]||0)/mediaQtyBase[m]:null;
    return {m, baseShare, prevShare, diff:baseShare-prevShare, mediaASP};
  }).sort((x,y)=>y.diff-x.diff);
  const risingLowAsp = mediaRows.filter(x=>x.diff>0.02 && x.mediaASP!=null && overallASP>0 && x.mediaASP<overallASP);

  document.getElementById('scrollArea').innerHTML=`
  <div class="sec-title">매출 증감 브리지 · ${b.prevMonth} → ${b.baseMonth}(마감)</div>
  <div class="kpi-row" style="margin-bottom:12px">
    <div class="kc"><div class="kl">전월 매출</div><div class="kv">${WM(b.totalPrev)}</div><div class="ks">${b.prevMonth}</div></div>
    <div class="kc"><div class="kl">기준월 매출</div><div class="kv">${WM(b.totalBase)}</div><div class="ks">${b.baseMonth}(마감)</div></div>
    <div class="kc"><div class="kl">증감액</div><div class="kv ${pc}">${WM(b.diff)}</div><div class="ks">전월 대비</div></div>
    <div class="kc"><div class="kl">증감률</div><div class="kv ${pc}">${PCT(b.totalPrev?b.diff/b.totalPrev:0)}</div><div class="ks">검증 PASS · 잔차 ${b.residual}원</div></div>
  </div>
  <div class="card"><div class="ct">매출 증감 브리지 워터폴</div>
    <div style="position:relative;width:100%;height:320px"><canvas id="cBridgeWaterfall" role="img" aria-label="매출 증감 브리지 워터폴" style="width:100%;height:100%"></canvas></div>
  </div>
  <div class="g2" style="margin-top:12px">
    <div class="card"><div class="ct">신규 조합 <span class="ct-note">${b.newG.length}개 · 합계 ${WM(b.newEffect)}</span></div>
      ${sortedNew.length?sortedNew.map(x=>`<div class="pr"><span>${x.label}</span><span class="pos">${WM(x.sales1)}</span></div>`).join(''):'<div style="color:var(--t3);font-size:12px">없음</div>'}
    </div>
    <div class="card"><div class="ct">재활성 조합 <span class="ct-note">${b.react.length}개 · 합계 ${WM(b.reactEffect)}</span></div>
      ${sortedReact.length?sortedReact.map(x=>`<div class="pr"><span>${x.label}</span><span class="pos">${WM(x.sales1)}</span></div>`).join(''):'<div style="color:var(--t3);font-size:12px">없음</div>'}
    </div>
  </div>
  <div class="g2">
    <div class="card"><div class="ct">소멸 조합 <span class="ct-note">${b.extinct.length}개 · 합계 -${WM(b.extinctEffect)}</span></div>
      ${sortedExtinct.length?sortedExtinct.map(x=>`<div class="pr"><span>${x.label}</span><span class="neg">-${WM(x.sales0)}</span></div>`).join(''):'<div style="color:var(--t3);font-size:12px">없음</div>'}
    </div>
    <div class="card"><div class="ct">공통 조합 변동 TOP <span class="ct-note">전월·당월 모두 판매</span></div>
      ${sortedCommon.length?sortedCommon.map(x=>{const d=x.sales1-x.sales0;return`<div class="pr"><span>${x.label}</span><span class="${d>=0?'pos':'neg'}">${d>=0?'+':''}${WM(d)}</span></div>`;}).join(''):'<div style="color:var(--t3);font-size:12px">없음</div>'}
    </div>
  </div>
  <div class="insight"><div class="ins-t">✦ 채널 믹스</div><ul class="ins-ul">
    ${risingLowAsp.length
      ? risingLowAsp.map(x=>`<li>평균 판매단가가 낮게 관측된 채널인 <b>${x.m}</b>의 매출 비중이 전월 대비 <b>+${(x.diff*100).toFixed(1)}%p</b> 증가했습니다.</li>`).join('')
      : '<li>평균 판매단가가 낮은 채널의 비중 증가는 관측되지 않았습니다.</li>'}
    <li>채널별 매출 비중(기준월 · 전월): ${mediaRows.map(x=>`${x.m} ${(x.baseShare*100).toFixed(0)}% · ${(x.prevShare*100).toFixed(0)}%`).join(' · ')}</li>
  </ul></div>`;

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const steps=[
      {label:'전월매출',value:b.totalPrev,type:'plus'},
      {label:'시장물량',value:b.marketVolume,type:b.marketVolume>=0?'plus':'minus'},
      {label:'상품믹스',value:b.mix,type:b.mix>=0?'plus':'minus'},
      {label:'가격효과',value:b.priceEffect,type:b.priceEffect>=0?'plus':'minus'},
      {label:'신규',value:b.newEffect,type:'plus'},
      {label:'재활성',value:b.reactEffect,type:'plus'},
      {label:'소멸',value:-b.extinctEffect,type:'minus'},
      {label:'당월매출',value:b.totalBase,type:'total'},
    ].filter(s=>s.label==='전월매출'||s.label==='당월매출'||s.value!==0);
    drawWaterfallCore('cBridgeWaterfall', steps);
  }));
}

/* ── 워터폴 (손익 뷰용) ── */
function drawWaterfall(canvasId, tot){
  const steps=[
    {label:'매출',value:tot.매출,type:'plus'},
    {label:'매입',value:-tot.매입,type:'minus'},
    {label:'PPL',value:-tot.ppl,type:'minus'},
    {label:'방송광고',value:-tot.광고방송,type:'minus'},
    {label:'온라인광고',value:-tot.광고온라인,type:'minus'},
    {label:'샘플비',value:-tot.샘플,type:'minus'},
    {label:'기타비용',value:-tot.기타,type:'minus'},
    ...(tot.재고>0?[{label:'재고자산',value:tot.재고,type:'plus'}]:[]),
    {label:'손익',value:tot.손익,type:'total'},
  ].filter(s=>s.label==='매출'||s.label==='손익'||s.value!==0);
  drawWaterfallCore(canvasId, steps);
}

// steps: [{label, value, type:'plus'|'minus'|'total'}] — value는 이미 부호까지 반영된 증감폭(마지막 total만 절대값)
function drawWaterfallCore(canvasId, steps){
  const canvas=document.getElementById(canvasId);
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const CW=canvas.offsetWidth||500, CH=canvas.offsetHeight||300;
  canvas.width=CW*window.devicePixelRatio; canvas.height=CH*window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  const PAD={top:24,right:16,bottom:44,left:72};
  const chartW=CW-PAD.left-PAD.right, chartH=CH-PAD.top-PAD.bottom;
  const barW=Math.min(chartW/steps.length*0.6,56), gap=chartW/steps.length;
  let running=0;
  const bars=steps.map(s=>{
    if(s.type==='total'){return{...s,base:0,end:s.value,isTotal:true};}
    const base=running; running+=s.value; return{...s,base,end:running};
  });
  const allVals=bars.flatMap(b=>[b.base,b.end]);
  const minV=Math.min(0,...allVals),maxV=Math.max(0,...allVals);
  const range=maxV-minV||1, pad=range*0.12;
  const yMin=minV-pad, yMax=maxV+pad, yRange=yMax-yMin;
  const toY=v=>PAD.top+chartH*(1-(v-yMin)/yRange);
  const toX=i=>PAD.left+gap*i+gap/2-barW/2;
  ctx.strokeStyle='#F3F4F6'; ctx.lineWidth=1;
  for(let i=0;i<=5;i++){const v=yMin+yRange*(i/5);const y=toY(v);ctx.beginPath();ctx.moveTo(PAD.left,y);ctx.lineTo(CW-PAD.right,y);ctx.stroke();ctx.fillStyle='#9CA3AF';ctx.font='9px Noto Sans KR,sans-serif';ctx.textAlign='right';const lbl=Math.abs(v)>=1e8?(v/1e8).toFixed(1)+'억':Math.abs(v)>=1e4?Math.round(v/1e4)+'만':Math.round(v).toString();ctx.fillText(lbl,PAD.left-6,y+3);}
  ctx.strokeStyle='#D1D5DB';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(PAD.left,toY(0));ctx.lineTo(CW-PAD.right,toY(0));ctx.stroke();
  ctx.strokeStyle='#D1D5DB';ctx.lineWidth=1;ctx.setLineDash([4,3]);
  bars.forEach((b,i)=>{if(i===0||b.isTotal)return;const y=toY(bars[i-1].end);ctx.beginPath();ctx.moveTo(toX(i-1)+barW,y);ctx.lineTo(toX(i),y);ctx.stroke();});
  ctx.setLineDash([]);
  bars.forEach((b,i)=>{
    const x=toX(i),yTop=toY(Math.max(b.base,b.end)),yBot=toY(Math.min(b.base,b.end)),bH=Math.max(yBot-yTop,2),r=4;
    let color=b.isTotal?(b.end>=0?'#059669':'#DC2626'):b.type==='plus'?'#3B82F6':'#F87171';
    ctx.fillStyle=color;ctx.beginPath();
    if(b.end>=b.base){ctx.moveTo(x+r,yTop);ctx.lineTo(x+barW-r,yTop);ctx.arcTo(x+barW,yTop,x+barW,yTop+r,r);ctx.lineTo(x+barW,yBot);ctx.lineTo(x,yBot);ctx.lineTo(x,yTop+r);ctx.arcTo(x,yTop,x+r,yTop,r);}
    else{ctx.moveTo(x,yTop);ctx.lineTo(x+barW,yTop);ctx.lineTo(x+barW,yBot-r);ctx.arcTo(x+barW,yBot,x+barW-r,yBot,r);ctx.lineTo(x+r,yBot);ctx.arcTo(x,yBot,x,yBot-r,r);ctx.lineTo(x,yTop);}
    ctx.closePath();ctx.fill();
    const absV=Math.abs(b.end-b.base);
    const lbl=absV>=1e8?(absV/1e8).toFixed(1)+'억':absV>=1e4?Math.round(absV/1e4)+'만':Math.round(absV).toLocaleString();
    const lblY=b.end>=b.base?yTop-6:yBot+13;
    ctx.fillStyle=b.isTotal?(b.end>=0?'#059669':'#DC2626'):b.type==='plus'?'#1D4ED8':'#B91C1C';
    ctx.font='bold 10px Noto Sans KR,sans-serif';ctx.textAlign='center';ctx.fillText(lbl,x+barW/2,lblY);
    ctx.fillStyle='#4B5563';ctx.font='10px Noto Sans KR,sans-serif';ctx.textAlign='center';ctx.fillText(b.label,x+barW/2,CH-PAD.bottom+16);
  });
}

/* ── 메인 렌더 ── */
function renderAll(){
  destroyCharts();
  if(curView==='pnl') renderPnl();
  else if(curView==='sku') renderSkuDiag();
  else if(curView==='bridge') renderBridge();
  else renderStatus();
}

window.addEventListener('DOMContentLoaded',()=>{
  updateSidebarActive(); buildFilter(); renderAll();
});
window.addEventListener('resize',()=>{
  if(curView==='pnl'){const c=document.getElementById('cWaterfall');if(c)drawWaterfall('cWaterfall',calcPnl(activeMonths()));}
});
</script>
